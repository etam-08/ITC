<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="conversion.html">Conversion</a>
    <a href="tax.html">Income Tax</a>
    <a href="loops.html">Looping</a>
    <a href="payroll.html">Payroll</a>
  </nav>
  <main>
    <h1>Conversion</h1>

    <div class="card">
      <h2>Celsius to Fahrenheit</h2>
      <label for="c2f">Degrees Celsius</label>
      <input type="number" id="c2f" placeholder="Enter °C">
      <div class="result" id="c2fOut"></div>
    </div>

    <div class="card">
      <h2>Fahrenheit to Celsius</h2>
      <label for="f2c">Degrees Fahrenheit</label>
      <input type="number" id="f2c" placeholder="Enter °F">
      <div class="result" id="f2cOut"></div>
    </div>

    <div class="card">
      <h2>Meters to Feet</h2>
      <label for="m2f">Meters</label>
      <input type="number" id="m2f" placeholder="Enter meters">
      <div class="result" id="m2fOut"></div>
    </div>

    <div class="card">
      <h2>Feet to Meters</h2>
      <label for="f2m">Feet</label>
      <input type="number" id="f2m" placeholder="Enter feet">
      <div class="result" id="f2mOut"></div>
    </div>
  </main>

  <script>
    // Connects an input box to an output box and a conversion formula
    const setupConverter = (inputId, outputId, convert, unit) => {
      const input = document.getElementById(inputId);
      const output = document.getElementById(outputId);

      input.addEventListener('input', () => {
        if (input.value === '') {
          output.textContent = '';
          return;
        }
        const result = convert(parseFloat(input.value));
        output.textContent = `Result: ${result.toFixed(2)} ${unit}`;
      });
    };

    setupConverter('c2f', 'c2fOut', c => (c * 9) / 5 + 32, '°F');
    setupConverter('f2c', 'f2cOut', f => ((f - 32) * 5) / 9, '°C');
    setupConverter('m2f', 'm2fOut', m => m * 3.28084, 'feet');
    setupConverter('f2m', 'f2mOut', ft => ft / 3.28084, 'meters');
  </script>
</body>
</html>
